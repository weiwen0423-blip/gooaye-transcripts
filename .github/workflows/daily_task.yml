name: Daily Gooaye Transcript

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 強制開啟寫入權限
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install feedparser requests openai-whisper torch

      - name: Run script
        run: python main.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          mkdir -p transcripts  # 雙重保險建立資料夾
          git add -A            # 強制追蹤所有新產生的檔案
          git commit -m "Auto update transcript" || echo "No changes to commit"
          git push origin main
