name: Daily Gooaye Transcript

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests openai-whisper torch

      - name: Run script
        run: python main.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 暴力解法：直接建立資料夾並在裡面放一個防空檔，確保 Git 一定抓得到路徑
          mkdir -p transcripts
          touch transcripts/.gitkeep
          git add -A
          # 檢查是否有變動，有的話才 commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto update transcript: $(date +'%Y-%m-%d')"
            git push origin main
          else
            echo "No changes to commit"
          fi
