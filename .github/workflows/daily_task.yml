name: Daily Gooaye Transcript

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必須要有這行，GitHub 才會讓你存檔
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests openai-whisper torch

      - name: Run script
        run: python main.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add transcripts/*.md
          # 檢查是否有檔案產生，有的話才 Push
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Add new transcript $(date)"
            git push origin main
          else
            echo "No new files found."
            exit 1 # 如果沒檔案就報錯，不讓你看到虛假的綠燈
          fi
