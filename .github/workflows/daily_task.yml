name: Daily Gooaye Transcript
on:
  schedule:
    - cron: '0 10 * * *' # 每天 UTC 10:00 (台灣時間 18:00) 執行
  workflow_dispatch: # 也可以手動點擊執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp openai-whisper torch

      - name: Run script
        run: python main.py

      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add transcripts/
          git commit -m "Add new transcript" || exit 0
          git push
